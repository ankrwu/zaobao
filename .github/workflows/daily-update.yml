name: Daily Update

on:
  schedule:
    # 每天北京时间 8:00 运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate daily report
        run: node scripts/generate-daily.js

      - name: Check for changes
        id: check_changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit new daily report
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.email "wubaiqing@vip.qq.com"
          git config user.name "wubaiqing"
          git commit -m "feat: 自动生成每日日报 [ci skip]"

      - name: Push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Build site
        run: npm run doc:build

      - name: Deploy to gh-pages
        run: |
          cd docs/.vuepress/dist
          git init
          git config user.email "wubaiqing@vip.qq.com"
          git config user.name "wubaiqing"
          git add -A
          git commit -m 'deploy: 发布到 gh-pages [ci skip]'
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git master:gh-pages
